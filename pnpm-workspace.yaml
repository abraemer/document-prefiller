# Single-package project: pnpm 11 reads all project config from this file
# (the legacy package.json "pnpm" field is no longer read). The `packages`
# field is omitted, which means only the root package is in the workspace.
allowBuilds:
  # macOS-only optional dep of vite that runs a node-gyp build script.
  # The pre-migration package manager always ran it on macOS; allowed
  # for behavior parity. Linux/Windows never install it.
  fsevents: true
  # Optional dep of sass@1.103.1 (build chain); its install script only
  # falls back to node-gyp when no prebuilt platform binary matches.
  # The pre-migration package manager ran it; allowed for behavior parity.
  '@parcel/watcher': true
  # Dep of electron-builder-squirrel-windows (electron-builder 26.15.3);
  # this project never builds Squirrel-Windows targets (win ships NSIS +
  # portable), so keep it installed but inert: its install script (7-Zip
  # arch selection) must not run. If a Squirrel target is ever added,
  # flip this back to true.
  electron-winstaller: false
