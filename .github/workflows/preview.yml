name: PR preview

# Same-repo PR previews on gh-pages (pr-<n>/ folders), plus close-time
# cleanup. Fork PRs build unprivileged in `build`; the approval-gated
# jobs below publish them from base-repo-context triggers (review
# submitted, fork build run completed) without ever checking out PR
# content. The weekly prune arrives in a later wave.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["PR preview"]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    # The event_name guard is load-bearing: on other trigger types the
    # event action is not a pull_request action at all ("completed" for a
    # completed-run trigger, etc.), so an unguarded build would run on
    # every completed run of this workflow — including its own — and
    # re-trigger itself indefinitely. Fork PRs build here too (unprivileged
    # merge-ref checkout, read-only token): that is the whole point.
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: preview-build-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Build webapp
        run: pnpm --config.minimum-release-age=0 build:web
      - name: Write preview manifest
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          mkdir -p preview-meta
          printf '%s' "$HEAD_SHA" > preview-meta/HEAD_SHA
          printf '%s' "$PR_NUMBER" > preview-meta/PR_NUMBER
      - name: Upload preview-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          # Multi-path upload MUST stay newline-separated: upload-artifact v4
          # splits the path input on newlines only (a comma is a literal
          # filename character), and the least-common-ancestor of these two
          # sibling folders keeps BOTH dist-web/ and preview-meta/ as
          # folders inside the artifact.
          path: |
            dist-web
            preview-meta
          if-no-files-found: error

  publish:
    # Same-repo PRs only: fork events carry a read-only GITHUB_TOKEN that a
    # permissions block cannot elevate. The event_name guard keeps the
    # write token off fork events entirely; approved fork PRs publish
    # through the dedicated base-repo-context jobs below instead.
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serializes every gh-pages mutation (production deploys, preview
    # publishes AND close-time cleanups); never cancel mid-mutation.
    concurrency:
      group: gh-pages-mutate
      cancel-in-progress: false
    steps:
      # Write-token job: check out main, NEVER the default merge ref (the
      # pull_request default ref is PR-derived content). The publish job
      # needs no PR code — HEAD_SHA comes from the event, the build from
      # the artifact — and main also pins the local composite below to its
      # reviewed version.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      # Idempotent gh-pages bootstrap. MUST run before the artifact
      # download: the first-run orphan branch wipes the working tree, so a
      # payload downloaded into the workspace first would be destroyed.
      # Identity lines first: hosted runners ship no gitconfig. The
      # composite re-runs this same script and hits the fetch+reset/no-op
      # branch by design.
      - name: Bootstrap gh-pages branch
        run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CUR=$(git symbolic-ref --short -q HEAD || true)
          if [ "$CUR" = "gh-pages" ]; then
            if git show-ref --verify --quiet refs/heads/gh-pages; then
              git fetch origin gh-pages && git reset --hard origin/gh-pages
            fi
          else
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git fetch origin gh-pages && git switch -c gh-pages --track origin/gh-pages
            else
              git switch --orphan gh-pages && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            fi
          fi
      # ${{ runner.temp }} IS $RUNNER_TEMP at runtime, but the action's
      # path input does not shell-expand $RUNNER_TEMP, so the run: steps
      # below reference the same directory via bash. OUTSIDE the workspace
      # keeps the commit surface clean; the caller stages only ./dist-web.
      - name: Download preview-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-dist
          path: ${{ runner.temp }}/artifact
      # The manifests are fork-run-controlled data (the fork path builds
      # this same artifact); a privileged consumer MUST re-derive both
      # values from its own event context and fail closed on any mismatch
      # BEFORE the composite mutates gh-pages. The error messages
      # intentionally do not echo the artifact values.
      - name: Verify artifact manifest against event
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_NUMBER: ${{ github.event.number }}
        run: |
          manifest_head_sha="$(cat "$RUNNER_TEMP/artifact/preview-meta/HEAD_SHA")"
          if [ "$manifest_head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "::error::artifact HEAD_SHA does not match github.event.pull_request.head.sha; refusing to publish" >&2
            exit 1
          fi
          manifest_pr_number="$(cat "$RUNNER_TEMP/artifact/preview-meta/PR_NUMBER")"
          if [ "$manifest_pr_number" != "$EVENT_PR_NUMBER" ]; then
            echo "::error::artifact PR_NUMBER does not match github.event.number; refusing to publish" >&2
            exit 1
          fi
          echo "manifest verified against event context"
      - name: Stage dist-web payload into workspace
        run: |
          mkdir -p dist-web
          cp -a "$RUNNER_TEMP/artifact/dist-web/." dist-web/
      - name: Publish PR preview folder
        uses: ./.github/actions/publish-preview
        with:
          # From the EVENT, never from the artifact manifest.
          pr-number: ${{ github.event.number }}
          mode: publish

  cleanup:
    # Fires on the closed action. Same-repo only: a fork-close event carries
    # a read-only GITHUB_TOKEN, so the local rm would succeed and the push
    # fail 403 — a RED job on every fork-PR close; fork folders are left
    # to the periodic prune instead.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gh-pages-mutate
      cancel-in-progress: false
    steps:
      # Write-token job: main only, never the PR merge ref.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Bootstrap gh-pages branch
        run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CUR=$(git symbolic-ref --short -q HEAD || true)
          if [ "$CUR" = "gh-pages" ]; then
            if git show-ref --verify --quiet refs/heads/gh-pages; then
              git fetch origin gh-pages && git reset --hard origin/gh-pages
            fi
          else
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git fetch origin gh-pages && git switch -c gh-pages --track origin/gh-pages
            else
              git switch --orphan gh-pages && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            fi
          fi
      - name: Remove PR preview folder
        uses: ./.github/actions/publish-preview
        with:
          # From the EVENT, never from the artifact manifest.
          pr-number: ${{ github.event.number }}
          mode: remove

  # --- Approval-gated fork track (base-repo context, write token) ---
  #
  # Fork `pull_request` events carry a READ-ONLY token, so `build` above
  # can run fork code unprivileged but can never touch gh-pages. These
  # two jobs are the only privileged consumers of that unprivileged
  # build: they never check out PR content (main only), re-derive every
  # manifest value from their own event context, and bind candidate runs
  # to the PR via GitHub-recorded fork identity, never via head SHA
  # alone.

  publish-approved-fork:
    # Gate: review.state alone would let ANY GitHub user approve a
    # public-repo PR and fire this write-token job, so the approval must
    # come from OWNER/MEMBER/COLLABORATOR. Fork PRs only: same-repo
    # publishes are handled by the `publish` job above.
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gh-pages-mutate
      cancel-in-progress: false
    # Pins auth for EVERY gh call below; an anonymous fallback `gh api`
    # would fail into a deferral branch and silently never publish.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Write-token job: main only, never the fork's merge ref.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      # Idempotent gh-pages bootstrap; identity lines first (hosted
      # runners ship no gitconfig). Must precede the artifact download:
      # the first-run orphan branch wipes the working tree.
      - name: Bootstrap gh-pages branch
        run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CUR=$(git symbolic-ref --short -q HEAD || true)
          if [ "$CUR" = "gh-pages" ]; then
            if git show-ref --verify --quiet refs/heads/gh-pages; then
              git fetch origin gh-pages && git reset --hard origin/gh-pages
            fi
          else
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git fetch origin gh-pages && git switch -c gh-pages --track origin/gh-pages
            else
              git switch --orphan gh-pages && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            fi
          fi
      # The --workflow/--event/--status filters are load-bearing: a bare
      # --commit query also matches ci.yml and deploy gate runs at the
      # same SHA.
      - name: Locate completed fork build run
        run: |
          RUN_ID="$(gh run list --workflow preview.yml --event pull_request --commit "${{ github.event.pull_request.head.sha }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ]; then
            echo "no completed fork build for the reviewed head SHA yet; the completed-run path will publish it"
            exit 0
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      # A head SHA is not PR-unique: an attacker can push an approved
      # PR's head commit to their own fork and open their own PR at the
      # same SHA. Only the run's GitHub-recorded fork identity binds it
      # to the reviewed PR. The event values reach this body ONLY via
      # env: mappings — the fork's branch name is attacker-chosen and
      # must never be interpolated into a run body.
      - name: Bind selected run to the reviewed PR
        if: env.RUN_ID != ''
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          RUN_REPO="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.head_repository.full_name')"
          RUN_BRANCH="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.head_branch')"
          if [ "$RUN_REPO" != "$PR_HEAD_REPO" ] || [ "$RUN_BRANCH" != "$PR_HEAD_REF" ]; then
            echo "latest successful run for this head SHA is not the reviewed PR's own build; skipping"
            exit 0
          fi
          echo "RUN_BOUND=true" >> "$GITHUB_ENV"
      # A review-submitted-then-close race can select a run that built
      # nothing; the response is an object, so only the nested filter
      # can ever see zero.
      - name: Check fork build artifact exists
        if: env.RUN_BOUND == 'true'
        run: |
          COUNT="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?name=preview-dist" --jq '.artifacts | length')"
          if [ "$COUNT" = "0" ]; then
            echo "selected run has no preview-dist artifact; nothing to publish"
            exit 0
          fi
          echo "ARTIFACT_READY=true" >> "$GITHUB_ENV"
      - name: Download fork build artifact
        if: env.ARTIFACT_READY == 'true'
        run: gh run download "$RUN_ID" --name preview-dist --dir "$RUNNER_TEMP/artifact"
      # The manifest is fork-run-controlled data; fail closed against
      # event-derived values before anything mutates gh-pages. Error
      # messages intentionally do not echo the artifact values.
      - name: Verify fork manifest against review event
        if: env.ARTIFACT_READY == 'true'
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          manifest_head_sha="$(cat "$RUNNER_TEMP/artifact/preview-meta/HEAD_SHA")"
          if [ "$manifest_head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "::error::artifact HEAD_SHA does not match the reviewed PR's head SHA; refusing to publish" >&2
            exit 1
          fi
          manifest_pr_number="$(cat "$RUNNER_TEMP/artifact/preview-meta/PR_NUMBER")"
          if [ "$manifest_pr_number" != "$EVENT_PR_NUMBER" ]; then
            echo "::error::artifact PR_NUMBER does not match the reviewed PR's number; refusing to publish" >&2
            exit 1
          fi
          echo "manifest verified against review event"
      - name: Stage fork dist-web payload
        if: env.ARTIFACT_READY == 'true'
        run: |
          mkdir -p dist-web
          cp -a "$RUNNER_TEMP/artifact/dist-web/." dist-web/
      - name: Publish approved fork preview folder
        if: env.ARTIFACT_READY == 'true'
        uses: ./.github/actions/publish-preview
        with:
          # From the EVENT, never from the artifact manifest.
          pr-number: ${{ github.event.pull_request.number }}
          mode: publish

  republish-approved-fork:
    # Republish-on-push for approved fork PRs: fork synchronize runs are
    # read-only and the review trigger has no synchronize type, so the
    # completed-run trigger carries the write token instead. The
    # pull_request event filter also stops this workflow's own
    # review/completed-trigger runs from re-firing it.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name != github.repository
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gh-pages-mutate
      cancel-in-progress: false
    # Pins auth for EVERY gh call below; an anonymous fallback `gh api`
    # in the derive step would fail into a deferral branch and silently
    # never publish.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Write-token job: main only, never the fork's merge ref.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Bootstrap gh-pages branch
        run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CUR=$(git symbolic-ref --short -q HEAD || true)
          if [ "$CUR" = "gh-pages" ]; then
            if git show-ref --verify --quiet refs/heads/gh-pages; then
              git fetch origin gh-pages && git reset --hard origin/gh-pages
            fi
          else
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git fetch origin gh-pages && git switch -c gh-pages --track origin/gh-pages
            else
              git switch --orphan gh-pages && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            fi
          fi
      # Pre-check FIRST: a close-action run builds nothing and uploads
      # no preview-dist, so a bare download would go RED on every
      # fork-PR close. The response is an object, so only the nested
      # filter can ever see zero.
      - name: Check triggering run artifact exists
        run: |
          COUNT="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts?name=preview-dist" --jq '.artifacts | length')"
          if [ "$COUNT" = "0" ]; then
            echo "triggering run has no preview-dist artifact; nothing to publish"
            exit 0
          fi
          echo "ARTIFACT_READY=true" >> "$GITHUB_ENV"
      # The payload names the run; no lookup needed.
      - name: Download triggering run artifact
        if: env.ARTIFACT_READY == 'true'
        run: gh run download "${{ github.event.workflow_run.id }}" --name preview-dist --dir "$RUNNER_TEMP/artifact"
      # Derive the PR from the run's GitHub-recorded identity, NEVER
      # from the fork-controlled manifest. The fork's branch name is
      # attacker-chosen, so it reaches this body ONLY as an environment
      # variable; gh percent-encodes -f fields into the query string.
      - name: Derive PR from run identity
        if: env.ARTIFACT_READY == 'true'
        env:
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PRS="$(gh api "repos/${{ github.repository }}/pulls" --method GET -f head="$HEAD_OWNER:$HEAD_BRANCH" -f base=main --jq 'length')"
          if [ "$PRS" = "0" ]; then
            echo "no open PR for the triggering run's head branch; nothing to publish"
            exit 0
          fi
          if [ "$PRS" != "1" ]; then
            echo "::error::expected exactly one PR for the run's head branch; got $PRS" >&2
            exit 1
          fi
          PR_NUMBER="$(gh api "repos/${{ github.repository }}/pulls" --method GET -f head="$HEAD_OWNER:$HEAD_BRANCH" -f base=main --jq '.[0].number')"
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::derived PR number failed numeric validation; refusing to publish" >&2
            exit 1
          fi
          echo "derived PR_NUMBER=$PR_NUMBER"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
      # The manifest is cross-checked as DATA against derived values: a
      # stale or forged manifest (the fork writes it) fails closed.
      - name: Cross-check manifest against derived values
        if: env.PR_NUMBER != ''
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          manifest_head_sha="$(cat "$RUNNER_TEMP/artifact/preview-meta/HEAD_SHA")"
          if [ "$manifest_head_sha" != "$RUN_HEAD_SHA" ]; then
            echo "artifact HEAD_SHA does not match the triggering run's head SHA; skipping (stale or forged manifest)"
            exit 0
          fi
          manifest_pr_number="$(cat "$RUNNER_TEMP/artifact/preview-meta/PR_NUMBER")"
          if [ "$manifest_pr_number" != "$PR_NUMBER" ]; then
            echo "artifact PR_NUMBER does not match the derived PR; skipping (stale or forged manifest)"
            exit 0
          fi
          echo "MANIFEST_OK=true" >> "$GITHUB_ENV"
      # Live gate: the PR must still be OPEN, approved by a write-access
      # reviewer, and its head must not have moved past the built
      # commit. headRefOid is the JSON field for the PR head SHA.
      - name: Gate on live PR state and approval
        if: env.MANIFEST_OK == 'true'
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_VIEW="$(gh pr view "$PR_NUMBER" --json state,reviewDecision,headRefOid)"
          state="$(printf '%s' "$PR_VIEW" | jq -r '.state')"
          review_decision="$(printf '%s' "$PR_VIEW" | jq -r '.reviewDecision')"
          head_oid="$(printf '%s' "$PR_VIEW" | jq -r '.headRefOid')"
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is not OPEN (state: $state); nothing to publish"
            exit 0
          fi
          if [ "$review_decision" != "APPROVED" ]; then
            echo "PR #$PR_NUMBER is not approved (reviewDecision: $review_decision); nothing to publish"
            exit 0
          fi
          if [ "$head_oid" != "$RUN_HEAD_SHA" ]; then
            echo "PR #$PR_NUMBER head has moved past the built commit; nothing to publish"
            exit 0
          fi
          echo "live gate passed for PR #$PR_NUMBER"
          echo "LIVE_GATE_OK=true" >> "$GITHUB_ENV"
      - name: Stage fork dist-web payload
        if: env.LIVE_GATE_OK == 'true'
        run: |
          mkdir -p dist-web
          cp -a "$RUNNER_TEMP/artifact/dist-web/." dist-web/
      - name: Publish approved fork preview folder
        if: env.LIVE_GATE_OK == 'true'
        uses: ./.github/actions/publish-preview
        with:
          # The GITHUB_ENV export from the derive step — validated numeric
          # there and re-validated by the composite's env contract.
          pr-number: ${{ env.PR_NUMBER }}
          mode: publish
