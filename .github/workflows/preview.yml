name: PR preview

# Same-repo PR previews on gh-pages (pr-<n>/ folders), plus close-time
# cleanup. Fork PRs build unprivileged in `build`; the review-submitted
# job below publishes approved fork PRs from base-repo context without
# ever checking out PR content, the completed-run republish for those
# PRs lives in the companion preview-republish.yml (a workflow_run
# trigger cannot live in the workflow it listens to), and a scheduled
# weekly prune garbage-collects the preview folders of PRs that were
# closed more than two weeks ago.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The event_name guard is load-bearing: the review/schedule/dispatch
    # triggers carry no PR action at all, so an unguarded build would
    # also run on every review submission and weekly timer. Fork PRs
    # build here too (unprivileged merge-ref checkout, read-only
    # token): that is the whole point.
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: preview-build-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Build webapp
        run: pnpm --config.minimum-release-age=0 build:web
      - name: Write preview manifest
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          mkdir -p preview-meta
          printf '%s' "$HEAD_SHA" > preview-meta/HEAD_SHA
          printf '%s' "$PR_NUMBER" > preview-meta/PR_NUMBER
      - name: Upload preview-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          # Multi-path upload MUST stay newline-separated: upload-artifact v4
          # splits the path input on newlines only (a comma is a literal
          # filename character), and the least-common-ancestor of these two
          # sibling folders keeps BOTH dist-web/ and preview-meta/ as
          # folders inside the artifact.
          path: |
            dist-web
            preview-meta
          if-no-files-found: error

  composite-available:
    # Bootstrap-window probe: the publish-preview composite resolves from
    # the main checkout in the jobs below, so it only exists once the PR
    # that introduces it merges. Until then those jobs skip green with a
    # notice instead of failing on the missing local action. API-based on
    # purpose: no checkout, no workspace, nothing privileged.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - name: Probe for the publish-preview composite on main
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/contents/.github/actions/publish-preview?ref=main" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "publish-preview composite present on main"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::publish-preview composite is not on main yet; preview publishing starts once the preview PR merges"
          fi

  publish:
    # Same-repo PRs only: fork events carry a read-only GITHUB_TOKEN that a
    # permissions block cannot elevate. The event_name guard keeps the
    # write token off fork events entirely; approved fork PRs publish
    # through the dedicated base-repo-context jobs below instead.
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && needs.composite-available.outputs.ready == 'true'
    needs: [build, composite-available]
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serializes every gh-pages mutation (production deploys, preview
    # publishes AND close-time cleanups); never cancel mid-mutation.
    concurrency:
      group: gh-pages-mutate
      cancel-in-progress: false
    steps:
      # Write-token job: check out main, NEVER the default merge ref (the
      # pull_request default ref is PR-derived content). The publish job
      # needs no PR code — HEAD_SHA comes from the event, the build from
      # the artifact — and main also pins the local composite below to its
      # reviewed version.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      # Idempotent gh-pages bootstrap. MUST run before the artifact
      # download: the first-run orphan branch wipes the working tree, so a
      # payload downloaded into the workspace first would be destroyed.
      # Identity lines first: hosted runners ship no gitconfig. The
      # composite re-runs this same script and hits the fetch+reset/no-op
      # branch by design.
      - name: Bootstrap gh-pages branch
        run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CUR=$(git symbolic-ref --short -q HEAD || true)
          if [ "$CUR" = "gh-pages" ]; then
            if git show-ref --verify --quiet refs/heads/gh-pages; then
              git fetch origin gh-pages && git reset --hard origin/gh-pages
            fi
          else
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git fetch origin gh-pages && git switch -c gh-pages --track origin/gh-pages
            else
              git switch --orphan gh-pages && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            fi
          fi
      # ${{ runner.temp }} IS $RUNNER_TEMP at runtime, but the action's
      # path input does not shell-expand $RUNNER_TEMP, so the run: steps
      # below reference the same directory via bash. OUTSIDE the workspace
      # keeps the commit surface clean; the caller stages only ./dist-web.
      - name: Download preview-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-dist
          path: ${{ runner.temp }}/artifact
      # The manifests are fork-run-controlled data (the fork path builds
      # this same artifact); a privileged consumer MUST re-derive both
      # values from its own event context and fail closed on any mismatch
      # BEFORE the composite mutates gh-pages. The error messages
      # intentionally do not echo the artifact values.
      - name: Verify artifact manifest against event
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_NUMBER: ${{ github.event.number }}
        run: |
          manifest_head_sha="$(cat "$RUNNER_TEMP/artifact/preview-meta/HEAD_SHA")"
          if [ "$manifest_head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "::error::artifact HEAD_SHA does not match github.event.pull_request.head.sha; refusing to publish" >&2
            exit 1
          fi
          manifest_pr_number="$(cat "$RUNNER_TEMP/artifact/preview-meta/PR_NUMBER")"
          if [ "$manifest_pr_number" != "$EVENT_PR_NUMBER" ]; then
            echo "::error::artifact PR_NUMBER does not match github.event.number; refusing to publish" >&2
            exit 1
          fi
          echo "manifest verified against event context"
      - name: Stage dist-web payload into workspace
        run: |
          mkdir -p dist-web
          cp -a "$RUNNER_TEMP/artifact/dist-web/." dist-web/
      - name: Publish PR preview folder
        uses: ./.github/actions/publish-preview
        with:
          # From the EVENT, never from the artifact manifest.
          pr-number: ${{ github.event.number }}
          mode: publish

  cleanup:
    # Fires on the closed action. Same-repo only: a fork-close event carries
    # a read-only GITHUB_TOKEN, so the local rm would succeed and the push
    # fail 403 — a RED job on every fork-PR close; fork folders are left
    # to the periodic prune instead.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && needs.composite-available.outputs.ready == 'true'
    needs: composite-available
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gh-pages-mutate
      cancel-in-progress: false
    steps:
      # Write-token job: main only, never the PR merge ref.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Bootstrap gh-pages branch
        run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CUR=$(git symbolic-ref --short -q HEAD || true)
          if [ "$CUR" = "gh-pages" ]; then
            if git show-ref --verify --quiet refs/heads/gh-pages; then
              git fetch origin gh-pages && git reset --hard origin/gh-pages
            fi
          else
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git fetch origin gh-pages && git switch -c gh-pages --track origin/gh-pages
            else
              git switch --orphan gh-pages && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            fi
          fi
      - name: Remove PR preview folder
        uses: ./.github/actions/publish-preview
        with:
          # From the EVENT, never from the artifact manifest.
          pr-number: ${{ github.event.number }}
          mode: remove

  # --- Approval-gated fork track (base-repo context, write token) ---
  #
  # Fork `pull_request` events carry a READ-ONLY token, so `build` above
  # can run fork code unprivileged but can never touch gh-pages. This
  # job and its completed-run sibling in preview-republish.yml are the
  # only privileged consumers of that unprivileged build: they never
  # check out PR content (main only), re-derive every manifest value
  # from their own event context, and bind candidate runs to the PR via
  # GitHub-recorded fork identity, never via head SHA alone.

  publish-approved-fork:
    # Gate: review.state alone would let ANY GitHub user approve a
    # public-repo PR and fire this write-token job, so the approval must
    # come from OWNER/MEMBER/COLLABORATOR. Fork PRs only: same-repo
    # publishes are handled by the `publish` job above.
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gh-pages-mutate
      cancel-in-progress: false
    # Pins auth for EVERY gh call below; an anonymous fallback `gh api`
    # would fail into a deferral branch and silently never publish.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Write-token job: main only, never the fork's merge ref.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      # Idempotent gh-pages bootstrap; identity lines first (hosted
      # runners ship no gitconfig). Must precede the artifact download:
      # the first-run orphan branch wipes the working tree.
      - name: Bootstrap gh-pages branch
        run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CUR=$(git symbolic-ref --short -q HEAD || true)
          if [ "$CUR" = "gh-pages" ]; then
            if git show-ref --verify --quiet refs/heads/gh-pages; then
              git fetch origin gh-pages && git reset --hard origin/gh-pages
            fi
          else
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git fetch origin gh-pages && git switch -c gh-pages --track origin/gh-pages
            else
              git switch --orphan gh-pages && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            fi
          fi
      # The --workflow/--event/--status filters are load-bearing: a bare
      # --commit query also matches ci.yml and deploy gate runs at the
      # same SHA.
      - name: Locate completed fork build run
        run: |
          RUN_ID="$(gh run list --workflow preview.yml --event pull_request --commit "${{ github.event.pull_request.head.sha }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ]; then
            echo "no completed fork build for the reviewed head SHA yet; the completed-run path will publish it"
            exit 0
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      # A head SHA is not PR-unique: an attacker can push an approved
      # PR's head commit to their own fork and open their own PR at the
      # same SHA. Only the run's GitHub-recorded fork identity binds it
      # to the reviewed PR. The event values reach this body ONLY via
      # env: mappings — the fork's branch name is attacker-chosen and
      # must never be interpolated into a run body.
      - name: Bind selected run to the reviewed PR
        if: env.RUN_ID != ''
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          RUN_REPO="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.head_repository.full_name')"
          RUN_BRANCH="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.head_branch')"
          if [ "$RUN_REPO" != "$PR_HEAD_REPO" ] || [ "$RUN_BRANCH" != "$PR_HEAD_REF" ]; then
            echo "latest successful run for this head SHA is not the reviewed PR's own build; skipping"
            exit 0
          fi
          echo "RUN_BOUND=true" >> "$GITHUB_ENV"
      # A review-submitted-then-close race can select a run that built
      # nothing; the response is an object, so only the nested filter
      # can ever see zero.
      - name: Check fork build artifact exists
        if: env.RUN_BOUND == 'true'
        run: |
          COUNT="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?name=preview-dist" --jq '.artifacts | length')"
          if [ "$COUNT" = "0" ]; then
            echo "selected run has no preview-dist artifact; nothing to publish"
            exit 0
          fi
          echo "ARTIFACT_READY=true" >> "$GITHUB_ENV"
      - name: Download fork build artifact
        if: env.ARTIFACT_READY == 'true'
        run: gh run download "$RUN_ID" --name preview-dist --dir "$RUNNER_TEMP/artifact"
      # The manifest is fork-run-controlled data; fail closed against
      # event-derived values before anything mutates gh-pages. Error
      # messages intentionally do not echo the artifact values.
      - name: Verify fork manifest against review event
        if: env.ARTIFACT_READY == 'true'
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          manifest_head_sha="$(cat "$RUNNER_TEMP/artifact/preview-meta/HEAD_SHA")"
          if [ "$manifest_head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "::error::artifact HEAD_SHA does not match the reviewed PR's head SHA; refusing to publish" >&2
            exit 1
          fi
          manifest_pr_number="$(cat "$RUNNER_TEMP/artifact/preview-meta/PR_NUMBER")"
          if [ "$manifest_pr_number" != "$EVENT_PR_NUMBER" ]; then
            echo "::error::artifact PR_NUMBER does not match the reviewed PR's number; refusing to publish" >&2
            exit 1
          fi
          echo "manifest verified against review event"
      - name: Stage fork dist-web payload
        if: env.ARTIFACT_READY == 'true'
        run: |
          mkdir -p dist-web
          cp -a "$RUNNER_TEMP/artifact/dist-web/." dist-web/
      - name: Publish approved fork preview folder
        if: env.ARTIFACT_READY == 'true'
        uses: ./.github/actions/publish-preview
        with:
          # From the EVENT, never from the artifact manifest.
          pr-number: ${{ github.event.pull_request.number }}
          mode: publish

  # --- Scheduled janitor (weekly timer + manual dispatch) ---
  #
  # Backstop for previews the close-time `cleanup` job cannot remove:
  # fork-PR folders (a fork-close event carries a read-only token, so
  # `cleanup` deliberately skips them) and previews orphaned by failed
  # or superseded runs. Folders of closed PRs are retained for 14 days
  # before deletion so reviewers can still open recent previews.

  prune:
    # Scheduled and manual runs only; every PR-driven event above keeps
    # routing to the jobs that gate on PR context.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # `pull-requests` is its own token scope: inside a permissions block
    # every unspecified scope becomes none, so a contents-only prune
    # would 403 on every gh pr view call below.
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Joins the serialized gh-pages mutation group; never cancel a
    # mutation mid-flight.
    concurrency:
      group: gh-pages-mutate
      cancel-in-progress: false
    steps:
      # Write-token job: main only, never any PR merge ref.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      # The pinned bootstrap below has no missing-branch handling of its
      # own (an origin without gh-pages would send it down the
      # orphan+wipe path). Nothing to prune in that case, so defer the
      # whole job green. A step's exit 0 alone does not end a job, so the
      # exported flag gates every later step.
      - name: Check gh-pages branch exists on origin
        run: |
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1 || exit 0
          echo "GH_PAGES_PRESENT=true" >> "$GITHUB_ENV"
      # Idempotent gh-pages bootstrap; the identity lines come first
      # because hosted runners ship no gitconfig — the prune's single
      # commit+push needs them.
      - name: Bootstrap gh-pages branch
        if: env.GH_PAGES_PRESENT == 'true'
        run: |
          git config user.name "github-actions[bot]" && \
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CUR=$(git symbolic-ref --short -q HEAD || true)
          if [ "$CUR" = "gh-pages" ]; then
            if git show-ref --verify --quiet refs/heads/gh-pages; then
              git fetch origin gh-pages && git reset --hard origin/gh-pages
            fi
          else
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git fetch origin gh-pages && git switch -c gh-pages --track origin/gh-pages
            else
              git switch --orphan gh-pages && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            fi
          fi
      # gh needs the token env even with the permissions block set above.
      # Folder names come from the gh-pages tree itself and the PR number
      # is numerically validated before it reaches gh, so no
      # attacker-influenceable field is ever interpolated here. A
      # per-folder gh failure (PR predates numbering, history was
      # rewritten) skips that folder without failing the job; a
      # commit/push failure after real deletions stays red.
      - name: Prune closed-PR preview folders
        if: env.GH_PAGES_PRESENT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '14 days ago' '+%s')
          deleted=()
          for dir in pr-*/; do
            [ -d "$dir" ] || continue
            name=${dir%/}
            if ! [[ "$name" =~ ^pr-([0-9]+)$ ]]; then
              echo "skipping '$name': not a pr-<number> preview folder"
              continue
            fi
            n=${BASH_REMATCH[1]}
            view=$(gh pr view "$n" --json state,closedAt 2>/dev/null || true)
            if [ -z "$view" ]; then
              echo "skipping pr-$n: gh pr view failed (PR may predate numbering or history was rewritten)"
              continue
            fi
            state=$(printf '%s' "$view" | jq -r '.state')
            closed_at=$(printf '%s' "$view" | jq -r '.closedAt')
            if [ "$state" = "OPEN" ]; then
              continue
            fi
            closed_ts=$(date -u -d "$closed_at" '+%s' 2>/dev/null || true)
            if [ -z "$closed_ts" ]; then
              echo "skipping pr-$n: closed ($state) but closedAt is missing or unparseable; keeping folder"
              continue
            fi
            if [ "$closed_ts" -ge "$CUTOFF" ]; then
              continue
            fi
            rm -rf "${dir:?}"
            echo "pruning $name (closed at $closed_at)"
            deleted+=("$name")
          done
          if [ "${#deleted[@]}" -eq 0 ]; then
            echo "no preview folder of a closed PR older than 14 days; nothing to prune"
            exit 0
          fi
          bootstrap_gh_pages() {
            git config user.name "github-actions[bot]" && \
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            CUR=$(git symbolic-ref --short -q HEAD || true)
            if [ "$CUR" = "gh-pages" ]; then
              if git show-ref --verify --quiet refs/heads/gh-pages; then
                git fetch origin gh-pages && git reset --hard origin/gh-pages
              fi
            else
              if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
                git fetch origin gh-pages && git switch -c gh-pages --track origin/gh-pages
              else
                git switch --orphan gh-pages && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
              fi
            fi
          }
          reapply_deletions() {
            for d in "${deleted[@]}"; do
              rm -rf "${d:?}"
            done
          }
          pushed=0
          for attempt in 1 2 3; do
            # A pathspec glob that matches nothing is fatal to git add,
            # but that is skip-class here (a competing prune already took
            # the folders); the porcelain check below is the real gate.
            git add -A -- 'pr-*' || true
            if [ -z "$(git status --porcelain)" ]; then
              echo "gh-pages tree already matches; nothing to commit"
              exit 0
            fi
            git commit -m "prune: remove preview folders of closed PRs"
            if git push origin HEAD:gh-pages; then
              pushed=1
              break
            fi
            echo "push to gh-pages rejected on attempt $attempt; re-running gh-pages bootstrap and retrying"
            bootstrap_gh_pages
            reapply_deletions
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::failed to push the gh-pages prune after 3 attempts" >&2
            exit 1
          fi
          echo "pruned preview folders: ${deleted[*]}"
