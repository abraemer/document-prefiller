name: Release

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        # transient: remove --config.minimum-release-age=0 (install AND run commands) once all lockfile packages are >1 day old (pnpm 11 default minimumReleaseAge=1d)
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm --config.minimum-release-age=0 run build:${{ matrix.platform }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-build
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          retention-days: 7

  attach-to-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && success()
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/**/*.AppImage
            ./artifacts/**/*.dmg
            ./artifacts/**/*.zip
            ./artifacts/**/*.exe
            ./artifacts/**/latest*.yml
            ./artifacts/**/*.blockmap
          fail_on_unmatched_files: true
