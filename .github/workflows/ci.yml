name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        # transient: remove --config.minimum-release-age=0 (install AND run commands) once all lockfile packages are >1 day old (pnpm 11 default minimumReleaseAge=1d)
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      - name: Lint
        run: pnpm --config.minimum-release-age=0 lint:check

      - name: Typecheck
        run: pnpm --config.minimum-release-age=0 typecheck

      - name: Test
        run: pnpm --config.minimum-release-age=0 test:run
